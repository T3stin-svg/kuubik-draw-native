name: Kuubik Draw Windows portable preview

on:
  workflow_dispatch:
  push:
    branches:
      - kuubik/visual-v0.2
    tags:
      - v0.2.0-preview.2
    paths-ignore:
      - 'docs/**'
      - 'evidence/**'
      - 'AI_START.md'
      - 'AGENTS.md'
      - 'NEXT_TASKS.md'
      - 'PROMPT_FOR_NEXT_AI.md'
      - 'README.md'
      - 'README_TEST.md'
      - 'FORK_NOTICE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'scripts/build-ai-handoff.ps1'

permissions:
  contents: read

concurrency:
  group: kuubik-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win64-portable:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout full fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned LibreCAD ancestry
        shell: pwsh
        run: |
          git cat-file -e '7ebab007d9eb4c68609388b835a2487648f0877b^{commit}'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned LibreCAD commit is unavailable.' }
          git merge-base --is-ancestor 7ebab007d9eb4c68609388b835a2487648f0877b HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Preview is not based on the pinned LibreCAD commit.' }

      - name: Verify handoff archive safety contracts
        shell: pwsh
        run: .\scripts\test-ai-handoff.ps1

      - name: Set and verify Windows UI test resolution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) -or
              -not (Get-Command Get-DisplayResolution -ErrorAction SilentlyContinue)) {
            throw 'Windows display-resolution cmdlets are unavailable on this runner.'
          }
          $modes = @(.\scripts\get-windows-display-modes.ps1)
          $modes | Format-Table | Out-Host
          # The hosted virtual adapter advertises at most 1920x1080. The native
          # test window explicitly supplies its client-height constraint to Qt;
          # its widget capture still must measure exactly 1920x1080 (no crop).
          $candidate = $modes | Where-Object {
            $_.Width -ge 1920 -and $_.Height -ge 1080 -and $_.BitsPerPixel -eq 32
          } | Sort-Object @{ Expression = { $_.Width * $_.Height } }, Width, Height |
              Select-Object -First 1
          if ($null -eq $candidate) { throw 'No supported display mode meets the 1920x1080 CI desktop minimum.' }
          Set-DisplayResolution -Width $candidate.Width -Height $candidate.Height -Force
          Start-Sleep -Seconds 2
          $actual = ((Get-DisplayResolution | Out-String) -replace "`0", '').Trim()
          $expected = "$($candidate.Width)x$($candidate.Height)"
          Write-Output "Windows display resolution for UI tests: $actual"
          if ($actual -ne $expected) { throw "Windows UI test desktop did not become ${expected}: $actual" }

      - name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 5.15 for MSVC 2019 x64
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          dir: '..'
          install-deps: true
          cache: false
          setup-python: true
          set-env: true
          aqtversion: '==3.1.*'
          py7zrversion: '==0.20.*'
          extra: '--external 7z'

      - name: Validate Kuubik icon registry
        shell: pwsh
        run: python .\scripts\check-kuubik-icons.py

      - name: Install pinned Qt jom parallel make tool
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'jom_1_1_7.zip'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'kuubik-jom-1.1.7'
          Invoke-WebRequest -Uri 'https://download.qt.io/official_releases/jom/jom_1_1_7.zip' -OutFile $archive
          # Publisher checksum: https://download.qt.io/official_releases/jom/jom_1_1_7.zip.mirrorlist
          $expected = '4c8af345586a9a08fbfd2f613fcac748226d91a75627aa3581b297dd513046fe'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Qt jom archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
          & (Join-Path $toolDirectory 'jom.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'Qt jom failed to start' }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify pinned SARibbon source and attribution
        shell: pwsh
        run: |
          python .\scripts\check-saribbon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\scripts\test-ribbon-layout.py

      - name: Scan source for committed secrets
        shell: pwsh
        run: |
          $version = '8.30.1'
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks_$($version)_windows_x64.zip"
          $toolDirectory = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          $uri = "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_$($version)_windows_x64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $expectedSha256 = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Gitleaks archive checksum mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
          $sourceArchive = Join-Path $env:RUNNER_TEMP 'kuubik-source.zip'
          $sourceDirectory = Join-Path $env:RUNNER_TEMP 'kuubik-source'
          git archive --format=zip --output=$sourceArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the committed source for Gitleaks.' }
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $sourceDirectory
          & (Join-Path $toolDirectory 'gitleaks.exe') dir --redact --verbose --no-banner $sourceDirectory
          if ($LASTEXITCODE -ne 0) { throw "Gitleaks failed with exit code $LASTEXITCODE" }

      - name: Install Boost headers
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://archives.boost.io/release/1.87.0/source/boost_1_87_0.7z' -OutFile boost.7z
          7z x boost.7z '-o.' -y | Out-Host
          Move-Item -LiteralPath boost_1_87_0 -Destination ..\boost
          Remove-Item -LiteralPath boost.7z

      - name: Configure portable MSVC build
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE.Replace('/', '\')
          $boost = (Join-Path (Split-Path $root -Parent) 'boost').Replace('/', '\')
          @(
            "CUSTOM_ROOT = $root"
            "BOOST_DIR = $boost"
            "BOOST_LIBDIR = $boost"
            'MSYSGIT_DIR = C:\Progra~1\Git\bin'
            'DISABLE_POSTSCRIPT = true'
          ) | Set-Content -LiteralPath custom.pri -Encoding ASCII
          Get-Content custom.pri

      - name: Build Kuubik Draw release binary
        shell: cmd
        run: |
          qmake.exe librecad.pro -r CONFIG+=release
          if errorlevel 1 exit /b 1
          jom.exe -j2 release
          if errorlevel 1 exit /b 1
          if not exist windows\KuubikDraw.exe exit /b 1

      - name: Package portable application
        id: package
        shell: pwsh
        run: .\scripts\package-kuubik-portable.ps1

      - name: Test portable folder and native file outputs
        shell: pwsh
        run: .\scripts\test-kuubik-portable.ps1 -PackageDirectory .\artifacts\KuubikDraw-0.2.0-preview.2-win64

      - name: Independently read back DXF, PDF and SVG
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet ezdxf==1.4.4 pypdf pillow
          python .\scripts\verify-preview-outputs.py "$env:RUNNER_TEMP\Kuubik Draw portable smoke"

      - name: Verify standalone PLOTSETTINGS ownership and writer reuse
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /MD /UNDEBUG /D_USE_MATH_DEFINES /I libraries\libdxfrw\src tests\dxf-plotsettings.cpp generated\lib\dxfrw.lib /Fe"%RUNNER_TEMP%\dxf-plotsettings.exe" /Fo"%RUNNER_TEMP%\dxf-plotsettings.obj"
          if errorlevel 1 exit /b 1
          python scripts\test-dxf-plotsettings.py "%RUNNER_TEMP%\dxf-plotsettings.exe" "%RUNNER_TEMP%\plotsettings-audit"
          if errorlevel 1 exit /b 1

      - name: Verify viewport camera records
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /MD /UNDEBUG /D_USE_MATH_DEFINES /I libraries\libdxfrw\src tests\dxf-viewport.cpp generated\lib\dxfrw.lib /Fe"%RUNNER_TEMP%\dxf-viewport.exe" /Fo"%RUNNER_TEMP%\dxf-viewport.obj"
          if errorlevel 1 exit /b 1
          python scripts\test-dxf-viewport.py "%RUNNER_TEMP%\dxf-viewport.exe" "%RUNNER_TEMP%\viewport-camera"
          if errorlevel 1 exit /b 1

      - name: Upload native GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KuubikDraw-0.2.0-preview.2-gui-evidence
          path: |
            ${{ runner.temp }}/Kuubik Draw portable smoke/kuubik-ui-contract.json
            ${{ runner.temp }}/Kuubik Draw portable smoke/workspace.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/workspace-idle.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/preview-smoke.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/preview-smoke.pdf
            ${{ runner.temp }}/Kuubik Draw portable smoke/preview-smoke.svg
            ${{ runner.temp }}/Kuubik Draw portable smoke/status-bar.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/status-bar-customization.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/settings-isolation.json
            ${{ runner.temp }}/plotsettings-audit/*.dxf
            ${{ runner.temp }}/viewport-camera/*.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/line-active.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/line-committed.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/line-gui-smoke.json
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/line-gui-smoke.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/pline-before-undo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/pline-after-undo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/pline-after-redo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/copy-before-undo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/copy-after-undo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/copy-after-redo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/move-before-undo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/move-after-undo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/gui-evidence/move-after-redo.dxf
            ${{ runner.temp }}/Kuubik Draw portable smoke/dpi-evidence/**/workspace.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/dpi-evidence/**/workspace-idle.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/dpi-evidence/**/kuubik-ui-contract.json
            ${{ runner.temp }}/Kuubik Draw portable smoke/tool-options-evidence/tool-options-line-1280.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/tool-options-evidence/tool-options-dimlinear-1280.png
            ${{ runner.temp }}/Kuubik Draw portable smoke/tool-options-evidence/tool-options-1280.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify SARibbon visible geometry and native identity
        shell: pwsh
        run: |
          $dpiRoot = Join-Path $env:RUNNER_TEMP 'Kuubik Draw portable smoke/dpi-evidence'
          python .\scripts\verify-ribbon-layout.py "$dpiRoot/reference/kuubik-ui-contract.json" --exact-reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scale in @('100', '125', '150')) {
            python .\scripts\verify-ribbon-layout.py "$dpiRoot/$scale/kuubik-ui-contract.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify archive payload and checksum
        shell: pwsh
        run: |
          $zip = '.\artifacts\KuubikDraw-0.2.0-preview.2-win64.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Portable ZIP is missing.' }
          $entries = tar -tf $zip
          $required = @('KuubikDraw.exe', 'README_TEST.md', 'FORK_NOTICE.md', 'build-manifest.json', 'SHA256SUMS.txt')
          foreach ($item in $required) {
            if (-not ($entries -contains $item)) { throw "ZIP entry missing: $item" }
          }
          if ($entries | Where-Object { $_ -match '\.(pdb|ilk|obj|exp|lib|idb|tlog)$' }) {
            throw 'ZIP contains forbidden build cache or symbol files.'
          }
          Get-FileHash -LiteralPath $zip -Algorithm SHA256

      - name: Upload tested portable preview
        uses: actions/upload-artifact@v4
        with:
          name: KuubikDraw-0.2.0-preview.2-win64
          path: |
            artifacts/KuubikDraw-0.2.0-preview.2-win64.zip
            artifacts/KuubikDraw-0.2.0-preview.2-win64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Preserve unverified package for failure diagnosis
        if: failure() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KuubikDraw-UNVERIFIED-diagnostic-only
          path: |
            artifacts/KuubikDraw-0.2.0-preview.2-win64.zip
            artifacts/KuubikDraw-0.2.0-preview.2-win64.zip.sha256
          if-no-files-found: warn
          retention-days: 7
